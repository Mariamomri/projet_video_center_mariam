sidebar.about: "À propos"
sidebar.aboutText: "Bienvenue sur Vidéo Center, un projet full-stack réalisé en Symfony. Vous pouvez vous inscrire avec un système de confirmation par email, vous connecter, poster vos vidéos, les gérer et modifier votre profil. Le site utilise Bootstrap pour le front-end, Symfony pour le back-end, et une base de données MySQL."
sidebar.howItWorks: "Comment ça marche ?"
sidebar.step1: "Regardez gratuitement les vidéos non premium, même sans compte."
sidebar.step2: "Créez un compte gratuit pour débloquer les vidéos premium."
sidebar.step3: "Une fois connecté, postez vos propres vidéos en un clic, faire des commentaires et faire des likes sur les vidéos."
sidebar.step4: "Utilisez la barre de recherche pour trouver une vidéo précise."
