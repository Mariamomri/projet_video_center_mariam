sidebar.about: من نحن
sidebar.aboutText: "مرحبًا بك في Vidéo Center، مشروع متكامل تم إنشاؤه باستخدام Symfony. يمكنك التسجيل بنظام تأكيد عبر البريد الإلكتروني، وتسجيل الدخول، ونشر فيديوهاتك، وإدارتها، وتعديل ملفك الشخصي. يستخدم الموقع Bootstrap للواجهة الأمامية، وSymfony للواجهة الخلفية، وقاعدة بيانات MySQL."
sidebar.howItWorks: كيف يعمل؟
sidebar.step1: "شاهد الفيديوهات غير المميزة مجانًا، حتى بدون حساب."
sidebar.step2: "أنشئ حسابًا مجانيًا لفتح الفيديوهات المميزة."
sidebar.step3: "بمجرد تسجيل الدخول، انشر فيديوهاتك الخاصة بنقرة واحدة."
sidebar.step4: "استخدم شريط البحث للعثور على فيديو محدد."
